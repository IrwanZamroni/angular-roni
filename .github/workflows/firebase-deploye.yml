name: CI/CD Angular Firebase

on:
  push:
    branches:
      - development
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: |
          if [[ "${GITHUB_REF##*/}" == "production" ]]; then
            npm run build -- --configuration production
          else
            npm run build -- --configuration development
          fi

      - name: Determine Firebase project
        id: firebase-project
        run: |
          if [[ "${GITHUB_REF##*/}" == "production" ]]; then
            echo "project=production" >> $GITHUB_OUTPUT
          else
            echo "project=development" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@v2.0.0
        with:
          args: deploy --project ${{ steps.firebase-project.outputs.project }} --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
